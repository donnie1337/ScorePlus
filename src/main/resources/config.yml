# =====================================================
#  CustomScoreboard - Configuração
#  Cores: use "&" para códigos de cor (&a, &c, &e, etc.)
# =====================================================

# A cada quantos ticks a scoreboard é atualizada (20 ticks = 1 segundo)
update-interval-ticks: 20

# A cada quantos "ciclos de atualização" o título troca de frame (animação)
title-animation-speed: 4

# Ativa o suporte ao PlaceholderAPI (precisa do plugin instalado no servidor)
use-placeholderapi: true

# Ativa o suporte à Vault para exibir saldo de economia no placeholder %coins%
use-vault: true

scoreboard:

  # Título animado: uma linha por frame, ele vai ciclando entre elas.
  # Pode usar apenas uma linha se não quiser animação.
  title-frames:
    - "&a&lS&2&lU&a&lR&2&lV&a&lI&2&lV&a&lA&2&lL"
    - "&2&lS&a&lU&2&lR&a&lV&2&lI&a&lV&2&lA&a&lL"

  # Linhas da scoreboard, de cima para baixo.
  # "" = linha em branco (funciona, cada branco precisa ser único, o plugin cuida disso).
  #
  # Placeholders internos disponíveis:
  #   %player%      -> nome do jogador
  #   %world%       -> mundo atual do jogador
  #   %online%      -> jogadores online no servidor
  #   %maxonline%   -> slots máximos do servidor
  #   %date%        -> data atual (dd/MM/yyyy)
  #   %kills%       -> kills (estatística vanilla do jogador)
  #   %deaths%      -> mortes (estatística vanilla do jogador)
  #   %kdr%         -> kills / mortes (2 casas decimais)
  #   %playtime%    -> horas jogadas (estatística vanilla)
  #   %coins%       -> saldo da economia via Vault (se use-vault: true)
  #
  # Além desses, se use-placeholderapi: true, você pode usar QUALQUER
  # placeholder de qualquer expansion instalada, ex: %vault_eco_balance%,
  # %clans_name%, %mcmmo_power_level%, etc.

  lines:
    - ""
    - "&f%date%"
    - "&7&m----------------"
    - "&e$ &fCoins&7: &a%coins%"
    - "&b⚡ &fNível&7: &b%mcmmo_power_level%"
    - "&c⚔ &fKills&7: &c%kills%"
    - "&4☠ &fMortes&7: &4%deaths%"
    - "&d⚑ &fClã&7: &d%clans_name%"
    - "&2🌍 &fMundo&7: &2%world%"
    - "&7&m----------------"
    - "&6&lwww.seusite.com"
