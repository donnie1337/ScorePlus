# =====================================================
#  ScorePlus - Configuração
#  Cores: use "&" para códigos de cor (&a, &c, &e, etc.)
# =====================================================

dynamic-update-enabled: true
update-interval-ticks: 20
title-animation-speed: 4
title-animation-enabled: true
use-placeholderapi: true

scoreboard:
  title-frames:
    - "  &b❄ &a&lSURVIVAL"

  lines:
    - ""
    - "┌&7%player%"
    - "    &7(&f%date%&7) "
    - " "
    - "  &e$ &fMoedas&7: &aMOEDAS"
    - "  &b⚡ &fPoder&7: &bMCMMO"
    - "  &c⚔ &fKills&7: &c%kills%"
    - "  &4☠ &fMortes&7: &4%deaths%"
    - "  &d⚑ &fClan&7: %clans_name%"
    - ""
    - " &2🌍 &fMundo&7: &2%world%"
    - " └&e🧭 &f/rtp"
    - ""
    - "    &6REDEGLOW.COM"

# Piscada do título no mesmo ciclo visual do DEV do CargoPlus
title-animation-interval-seconds: 10
title-animation-white-ms: 250
title-animation-normal-ms: 250
title-animation-blinks: 3
