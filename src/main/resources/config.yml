# =====================================================
#  ScorePlus - Configuração
#  Cores: use "&" para códigos de cor (&a, &c, &e, etc.)
# =====================================================

dynamic-update-enabled: true
update-interval-ticks: 20
title-animation-speed: 4
title-animation-enabled: true
use-placeholderapi: true

# =====================================================
#  EFEITOS DO SURVIVAL
# =====================================================
# Escolha aqui o efeito utilizado no SURVIVAL no rodapé da scoreboard.
# Use "alternar" para passar automaticamente pelos 9 efeitos.
#
# Eventos disponíveis:
# - onda-brilho      -> brilho percorre as letras
# - pulso-central    -> brilho começa no centro e se espalha
# - varredura        -> reflexo branco percorre o título
# - respiracao       -> título inteiro pulsa suavemente
# - arco-luz         -> brilho percorre deixando uma pequena cauda
# - duas-ondas       -> duas ondas partem das extremidades
# - centro-explodindo -> brilho cresce do centro para as pontas
# - eco              -> brilho percorre deixando um eco suave
# - neve             -> reflexo branco suave, combinando com o ❄
#
efeito-score: "alternar"
# Tempo que cada efeito permanece ativo antes de passar para o próximo.
efeito-score-duracao-segundos: 2

scoreboard:
  title-frames:
    - " <gradient:#B19CD8:#BEA9DF>&lREDE EDGE</gradient>"

  lines:
    - "    &7(&f%date%&7) "
    - ""
    - "┌&7%player%"
    - "   &e$ &fMoedas&7: &aMOEDAS"
    - "   &b⚡ &fPoder&7: &b%mcmmo_power%"
    - "   &c⚔ &fKills&7: &c%kills%"
    - "   &4☠ &fMortes&7: &4%deaths%"
    - "   &d⚑ &fClan&7: %clans_name%"
    - ""
    - " &2🌍 &fMundo&7: &2%world%"
    - " └&e🧭 &f/rtp"
    - ""
    - "&8██████████████ &a&lSURVIVAL &8██████████████"

# Configuração base da animação do título.
# O efeito selecionado em "efeito-score" controla apenas o SURVIVAL no rodapé; o título REDE EDGE permanece fixo.
title-animation-interval-seconds: 10
title-animation-white-ms: 250
title-animation-normal-ms: 250
title-animation-blinks: 3
